# ==================================================
#  Coturn TURN/STUN Server Configuration
#  Финальная версия для продакшена
# ==================================================

# ------------------- Порты -------------------
listening-port=3478
tls-listening-port=5349

# ------------ WebRTC обязательные ------------
fingerprint
lt-cred-mech
realm=blockchat.ru

# ------------ Аутентификация (REST API) ------------
# Используем статический секрет из .env (TURN_STATIC_AUTH_SECRET)
static-auth-secret=mysecretpasswordZxcv

# Статический пользователь не нужен – закомментирован
# user=darkmessenger:mysecretpasswordZXCV

# ------------ IP-адреса ------------
external-ip=90.189.125.50
relay-ip=0.0.0.0

# ------------ Диапазон релейных портов ------------
min-port=49160
max-port=49200

# ------------ SSL/TLS сертификаты ------------
cert=/etc/nginx/ssl/blockcoin.ru-chain.pem
pkey=/etc/nginx/ssl/blockcoin.ru-key.pem

# ------------ Безопасность ------------
no-multicast-peers

# ------------ Производительность и ограничения ------------
max-sessions=1000
session-timeout=600

# ------------ Логирование ------------
verbose
log-file=stdout