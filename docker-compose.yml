services:
  backend:
    build: .
    container_name: dark-backend
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:zXCV123zXCV@db:5432/bichat_db
      - FLASK_ENV=production
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:stable-alpine
    container_name: dark-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - C:/nginx/ssl:/etc/nginx/ssl:ro
      - C:/nginx/html:/usr/share/nginx/html:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
    restart: unless-stopped

  coturn:
    image: coturn/coturn:latest
    container_name: dark-coturn
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "5349:5349"
      - "49160-49200:49160-49200/udp"
    volumes:
      - ./turnserver.conf:/etc/turnserver.conf:ro
      - C:/nginx/ssl:/etc/nginx/ssl:ro
    command: -c /etc/turnserver.conf --verbose --log-file=stdout
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    container_name: dark-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: zXCV123zXCV
      POSTGRES_DB: bichat_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - C:/backup:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: