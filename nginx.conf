worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # HTTP -> HTTPS redirect
    server {
        listen 80;
        server_name blockcoin.ru www.blockcoin.ru blockchat.ru www.blockchat.ru;

        location ^~ /.well-known/acme-challenge/ {
            root /usr/share/nginx/html;
            try_files $uri =404;
        }

        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name blockcoin.ru www.blockcoin.ru blockchat.ru www.blockchat.ru;

        ssl_certificate     /etc/nginx/ssl/blockcoin.ru-chain.pem;
        ssl_certificate_key /etc/nginx/ssl/blockcoin.ru-key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout 5m;

        client_max_body_size 100M;

        # ---------- WebSocket ----------
        location /ws {
            proxy_pass http://host.docker.internal:8000/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_set_header Origin $http_origin;
            proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
            proxy_set_header Sec-WebSocket-Extensions $http_sec_websocket_extensions;
        }

        # ---------- AI streaming (no buffering) ----------
        location /ai/chat {
            proxy_pass http://host.docker.internal:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
            chunked_transfer_encoding on;
            proxy_set_header X-Accel-Buffering no;
        }

        # ---------- All other requests ----------
        location / {
            proxy_pass http://host.docker.internal:8000;
            proxy_http_version 1.1;                          # ← ТОЛЬКО ОДНА (было две)
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;   # ← оставлена одна версия
            proxy_read_timeout 500s;
            proxy_connect_timeout 500s;
        }
    }
}