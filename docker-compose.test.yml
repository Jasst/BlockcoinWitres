version: '3.8'

services:
  # Тестовая база данных
  test-db:
    image: postgres:17-alpine
    container_name: test-postgres
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: testdb
    ports:
      - "5433:5432" # Доступен на порту 5433, чтобы не конфликтовать с основной
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - test-network

  # Простое тестовое приложение (Python)
  test-app:
    image: python:3.11-slim
    container_name: test-app
    working_dir: /app
    command: >
      bash -c "
      pip install psycopg2-binary &&
      python -c \"
import psycopg2
import time
import sys

print('Waiting for DB...')
for i in range(30):
    try:
        conn = psycopg2.connect(
            host='test-db',
            port=5432,
            user='testuser',
            password='testpass',
            dbname='testdb'
        )
        cur = conn.cursor()
        cur.execute('SELECT version();')
        print('SUCCESS: Connected to DB!')
        print('DB Version:', cur.fetchone()[0])
        cur.close()
        conn.close()
        sys.exit(0)
    except Exception as e:
        print(f'Trying... ({i+1}/30) Error: {e}')
        time.sleep(2)
        
print('FAILED: Could not connect to DB after 60 seconds')
sys.exit(1)
\"
      "
    depends_on:
      test-db:
        condition: service_healthy
    networks:
      - test-network

networks:
  test-network:
    driver: bridge